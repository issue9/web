- key: cmd.daemon
  message:
    msg: 将当前程序作为守护进程进行的相关操作
- key: cmd.daemon_usage
  message:
    msg: |
      将当前程序作为守护进程进行的相关操作，包含以下几种取值：
       - install 安装为守护进程；
       - uninstall 卸载；
       - start 启动服务；
       - stop 停止服务；
       - restart 重启服务；
       - status 查看守护进程的当前状态；
