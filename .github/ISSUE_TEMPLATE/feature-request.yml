name: 功能建议
description: 提出新功能或改进建议
title: "功能建议："
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明当前遇到的限制或使用场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 描述你期望的功能或 API 行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 如果有，请说明你考虑过的其他实现方式。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
    validations:
      required: false
